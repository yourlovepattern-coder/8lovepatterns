    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2.1rem, 1.3rem + 3.2vw, 3.4rem);
    line-height: 1.08;
    letter-spacing: -.025em;
    color: var(--encre);
    text-align: center;
    margin: 0;
  }
  .lp-hm-h2-sub {
    text-align: center;
    margin: 16px auto 0;
    max-width: 620px;
    font-size: .95rem;
    line-height: 1.55;
    color: var(--body-2);
    text-wrap: pretty;
  }
  .lp-hm-teal { color: #2C7E91; font-weight: 700; }
  .lp-hm-grey { color: var(--body-2); }
  .lp-hm-coral { color: #EE6352; }

  .lp-hm-cta-row { display: flex; justify-content: center; margin-top: clamp(24px, 3vw, 34px); }

  /* ---- 1. HERO ----------------------------------------------------------
     min-height: 90vh so the hero fills nearly the whole first screen at
     1440x900-ish. The 1280px "stage" cap from a previous pass is GONE per
     the mockup re-match: HeroFloatingCards is positioned against the full
     .lp-hm-hero section (whatever the window width is), matching the
     validated mockup's cards spreading from ~12% to ~92% of the window.
     Only the text column (.lp-hm-hero-content) stays capped at 640px and
     centered — that part is unchanged. No align-items on the hero itself
     (default stretch): .lp-hm-hero-inner is the section's only IN-FLOW
     child (HeroFloatingCards is position:absolute, out of flow), so it
     stretches to the hero's full height and centers the text column
     within that full height via its own align-items/justify-content. */
  .lp-hm-hero {
    position: relative;
    min-height: 90vh;
    display: flex;
    background: var(--hero-bg-grad);
    padding: clamp(24px, 3vw, 40px) 0;
    overflow: hidden;
  }
  .lp-hm-hero-inner {
    position: relative; z-index: 3; width: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 0 var(--gutter);
  }
  /* Kept narrow on purpose: the floating cards need the outer thirds of the
     window, and the mockup's headline column is a lot narrower than the page.
     No align-items here on purpose: default `stretch` gives every child the
     full 640px to lay out against (each section centers its own content via
     text-align/justify-content) — `align-items:center` would shrink-wrap
     each child to its own fit-content width instead, which was wrapping the
     3-stat row a beat early. */
  .lp-hm-hero-content {
    width: 100%; max-width: 640px; text-align: center;
    display: flex; flex-direction: column;
  }

  .lp-hm-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2.1rem, 1.2rem + 3.1vw, 3.25rem);
    line-height: 1.03;
    letter-spacing: -.035em;
    color: var(--encre);
    margin: 0;
    text-wrap: balance;
    order: 1;
  }
  .lp-hm-stats { order: 2; }
  .lp-hm-sub { order: 3; }
  .lp-hm-cta-row { order: 4; }
  .lp-hm-stars { order: 5; }

  /* Floating cards: absolutely positioned over the FULL .lp-hm-hero section
     (edge-to-edge, no padding of its own), replaced by .lp-hm-cluster on
     phones so the hero never overflows. Every card in the mockup is a
     perfect square, sized as a % of the hero's width (matching the
     "4-7.5% of the window" measurement) — width is set inline per card,
     aspect-ratio:1 derives the height so it scales together, instead of a
     fixed px height that would drift off-square at other viewport widths. */
  .lp-hm-floats { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .lp-hm-float {
    position: absolute;
    aspect-ratio: 1;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(20,20,43,.16);
    background: #fff;
  }
  .lp-hm-float img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lp-hm-emoji {
    position: absolute;
    aspect-ratio: 1;
    z-index: 2;
    background: #fff;
    border-radius: 17px;
    box-shadow: 0 12px 28px rgba(20,20,43,.16);
    display: grid;
    place-items: center;
  }
  .lp-hm-emoji img { width: 70%; height: 70%; object-fit: contain; display: block; }

  /* Per-card float: 8-12px of vertical travel, 6-9s, ease-in-out, infinite,
     each card started at its own negative delay so none of them move in sync.
     A 1-2deg tilt rides along. Disabled entirely under reduced motion. */
  @keyframes lp-hm-drift {
    from { transform: translateY(0) rotate(var(--r0)); }
    to   { transform: translateY(var(--dy)) rotate(var(--r1)); }
  }
  .lp-hm-drift {
    animation: lp-hm-drift var(--dur) ease-in-out var(--delay) infinite alternate;
    will-change: transform;
  }
  @media (prefers-reduced-motion: reduce) {
    .lp-hm-drift { animation: none; transform: none; }
  }

  /* ---- Mobile photo cluster (Liven structure): one dominant tile with
     several smaller, rotated, overlapping satellites. Hidden on desktop,
     where .lp-hm-floats takes over. Height is capped at ~40% of the
     viewport height per the corrections brief. ---- */
  .lp-hm-cluster { display: none; }
  .lp-hm-cluster-main, .lp-hm-cluster-sat {
    position: absolute; border-radius: 18px; overflow: hidden; background: #fff;
    box-shadow: 0 10px 24px rgba(20,20,43,.18);
  }
  .lp-hm-cluster-main img, .lp-hm-cluster-sat img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lp-hm-cluster-main {
    width: 55%; aspect-ratio: 4 / 5;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 4;
  }
  .lp-hm-cluster-sat { aspect-ratio: 1 / 1; }

  /* Hero proof row */
  .lp-hm-stats {
    display: flex; justify-content: center; align-items: flex-start;
    gap: clamp(10px, 1.6vw, 20px);
    margin-top: clamp(24px, 3vw, 36px);
    flex-wrap: wrap;
  }
  /* 3 x 185px + 2 gaps must stay under the 640px hero-content column so the
     row never wraps to 2-then-1 at desktop widths (see the align-items note
     above — the column really is only 640px, no shrink-wrap involved). */
  .lp-hm-stat { flex: 0 1 185px; text-align: center; }
  .lp-hm-stat-vis { height: 80px; display: grid; place-items: center; margin-bottom: 10px; }
  .lp-hm-stat-emoji { width: 56px; height: 56px; object-fit: contain; display: block; }
  /* certified2.png is a wide-format image (3 headshots + a badge), not a
     square emoji — sized on its own so it stays readable. */
  .lp-hm-stat-emoji-wide { width: 150px; height: auto; object-fit: contain; display: block; }
  .lp-hm-stat-txt { margin: 0; font-size: .9375rem; font-weight: 400; line-height: 1.35; color: var(--encre); }
  .lp-hm-stat-big { font-family: var(--font-display); font-weight: 800; font-size: 2.75rem; line-height: 1.1; letter-spacing: -.02em; }
  .lp-hm-stat-big-sm { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; line-height: 1.4; }

  .lp-hm-sub {
    margin: clamp(22px, 3vw, 32px) auto 0;
    max-width: 560px;
    font-size: .92rem;
    line-height: 1.6;
    color: var(--encre);
    text-wrap: pretty;
  }

  .lp-hm-stars { display: flex; justify-content: center; gap: 4px; margin-top: 22px; color: #F0B429; }
  .lp-hm-stars svg { fill: currentColor; stroke: none; }

  /* ---- 2. THE EIGHT PATTERNS ---- */
  .lp-hm-patterns {
    background: #E5EAF1;
    padding: clamp(48px, 7vw, 88px) var(--gutter);
  }
  .lp-hm-pgrid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 16px; margin-top: clamp(28px, 4vw, 44px);
  }
  .lp-hm-pcard {
    background: #fff; border: none; border-radius: 18px; box-shadow: var(--sh-1);
    padding: 16px 18px 18px; text-align: left; cursor: pointer; width: 100%;
    display: flex; flex-direction: column; gap: 6px;
    font-family: var(--font-body);
  }
  .lp-hm-pcard-fig { height: 100px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  /* Height is set on the <img> itself: a percentage max-height would resolve
     against an auto-sized row and let the illustration escape the box. */
  .lp-hm-pcard-fig img { height: 100px; width: auto; max-width: 100%; object-fit: contain; display: block; }
  .lp-hm-pcard-name { margin: 6px 0 0; font-family: var(--font-display); font-weight: 700; font-size: .92rem; color: var(--encre); }
  .lp-hm-pcard-desc { margin: 0; font-size: .78rem; line-height: 1.45; color: var(--body-2); text-wrap: pretty; }
  .lp-hm-pcard-go { margin-top: auto; padding-top: 8px; font-size: .72rem; font-weight: 600; color: var(--ink-3); }
  .lp-hm-pcard:hover .lp-hm-pcard-go { color: var(--encre); }

  .lp-hm-outline {
    display: inline-block; border-radius: var(--r-pill);
    border: 1px solid #C4CBD6; background: transparent; color: var(--encre);
    font-family: var(--font-body); font-weight: 600; font-size: .88rem;
    padding: 12px 24px; text-decoration: none; cursor: pointer;
    transition: background-color .2s ease, border-color .2s ease;
  }
  .lp-hm-outline:hover { background: rgba(255,255,255,.7); border-color: var(--encre); }

  /* ---- 3. MINI ARTICLES ---- */
  .lp-hm-mini {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 12px; padding: clamp(20px, 3vw, 32px) clamp(16px, 2vw, 24px);
    background: #fff;
  }
  .lp-hm-mini-card {
    position: relative; border-radius: 20px; overflow: hidden;
    min-height: clamp(340px, 30vw, 400px);
    display: flex; align-items: flex-end;
  }
  .lp-hm-mini-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .lp-hm-mini-veil {
    position: absolute; inset: 0;
    background: linear-gradient(0deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.28) 45%, rgba(0,0,0,0) 100%);
  }
  .lp-hm-mini-body {
    position: relative; z-index: 1; padding: clamp(18px, 2vw, 26px);
    display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
  }
  .lp-hm-mini-label {
    display: inline-block; border-radius: var(--r-pill);
    background: rgba(255,255,255,.22); color: #fff;
    font-size: .68rem; font-weight: 600; padding: 5px 12px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .lp-hm-mini-title {
    margin: 0; color: #fff; font-family: var(--font-display); font-weight: 800;
    font-size: clamp(1.15rem, .95rem + .6vw, 1.5rem); line-height: 1.15; letter-spacing: -.02em;
  }
  .lp-hm-mini-text { margin: 0; color: rgba(255,255,255,.9); font-size: .78rem; line-height: 1.5; text-wrap: pretty; }

  /* ---- 4. SCIENCE ---- */
  .lp-hm-science {
    background: linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 55%, #EDF7EF 100%);
    padding: clamp(48px, 7vw, 88px) var(--gutter);
  }
  .lp-hm-sci-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 14px; margin-top: clamp(28px, 4vw, 44px);
  }
  .lp-hm-sci-card { background: #F6FAFB; border-radius: 16px; padding: 16px 18px; }
  .lp-hm-sci-card h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: .86rem; color: #2C7E91; }
  .lp-hm-sci-card p { margin: 8px 0 0; font-size: .74rem; line-height: 1.5; color: var(--body-2); text-wrap: pretty; }

  .lp-hm-refs { max-width: 680px; margin: clamp(22px, 3vw, 32px) auto 0; color: var(--ink-3); }
  .lp-hm-refs ol { margin: 0; padding-left: 18px; }
  .lp-hm-refs li { font-size: .68rem; line-height: 1.7; }
  .lp-hm-refs > p { margin: 12px 0 0; font-size: .68rem; line-height: 1.7; }

  /* ---- 5. FAQ ---- */
  .lp-hm-faq { background: #F2F5F8; padding: clamp(48px, 7vw, 88px) var(--gutter); }
  .lp-hm-faq-card {
    max-width: 620px; margin: 0 auto; background: #fff;
    border-radius: 20px; box-shadow: var(--sh-1);
    padding: clamp(32px, 4vw, 52px) clamp(22px, 3vw, 44px);
  }
  .lp-hm-faq-h { margin-bottom: clamp(24px, 3vw, 38px); }
  .lp-hm-faq-item { border-top: 1px solid #ECEFF3; }
  .lp-hm-faq-item:first-child { border-top: none; }
  .lp-hm-faq-item > summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 0;
    font-family: var(--font-display); font-weight: 600; font-size: .84rem;
    line-height: 1.4; color: var(--encre);
  }
  .lp-hm-faq-item > summary::-webkit-details-marker { display: none; }
  .lp-hm-faq-item > summary svg { flex-shrink: 0; color: var(--ink-3); transition: transform .25s ease; }
  .lp-hm-faq-item[open] > summary svg { transform: rotate(180deg); }
  .lp-hm-faq-item > p { margin: 0 0 16px; font-size: .78rem; line-height: 1.65; color: var(--body-2); text-wrap: pretty; }

  /* ---- Homepage responsive ---- */
  @media (max-width: 1080px) {
    .lp-hm-hero { min-height: 0; padding-top: clamp(84px, 16vw, 104px); }
    .lp-hm-float, .lp-hm-emoji { display: none; }
    .lp-hm-hero-content { max-width: 520px; }
    /* Mobile order: cluster, title, sub, CTA, stats (the button moves above
       the stats here only — desktop order is untouched, see base rules). */
    .lp-hm-cluster { display: block; position: relative; height: clamp(230px, 40vh, 320px); order: 0; margin-bottom: clamp(24px, 5vw, 40px); }
    .lp-hm-title { order: 1; }
    .lp-hm-sub { order: 2; margin-top: 16px; }
    .lp-hm-cta-row { order: 3; margin-top: 20px; }
    .lp-hm-stats { order: 4; margin-top: 26px; }
    .lp-hm-stars { order: 5; }
  }
  @media (max-width: 980px) {
    .lp-hm-pgrid { grid-template-columns: repeat(2, 1fr); }
    .lp-hm-sci-grid { grid-template-columns: repeat(2, 1fr); }
    .lp-hm-mini { grid-template-columns: 1fr; }
  }
  @media (max-width: 620px) {
    .lp-hm-pgrid { grid-template-columns: 1fr; }
    .lp-hm-sci-grid { grid-template-columns: 1fr; }
    /* One row, no wrap: three equal-width stats instead of 2-then-1. */
    .lp-hm-stats { flex-wrap: nowrap; gap: 8px; }
    .lp-hm-stat { flex: 1 1 0; min-width: 0; }
    .lp-hm-stat-vis { height: 36px; margin-bottom: 6px; }
    .lp-hm-stat-emoji { width: 34px; height: 34px; }
    .lp-hm-stat-emoji-wide { width: 92px; }
    .lp-hm-stat-txt { font-size: .66rem; }
    .lp-hm-stat-big { font-size: 1.5rem; }
    .lp-hm-stat-big-sm { font-size: .78rem; }
    .lp-hm-sub br { display: none; }
    .lp-hm-sub { font-size: .84rem; }
    .lp-hm-title { font-size: clamp(1.9rem, 1.3rem + 4vw, 2.4rem); }
    .lp-hm-cluster { height: clamp(200px, 36vh, 260px); }
  }
</style>
